name: Auto-Delete Merged Branches

on:
  pull_request:
    types: [closed]

jobs:
  delete-branches:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged branch
        uses: actions/delete-branch@1.3.0
        with:
          branch: ${{ github.head_ref }}
          expected_remote: origin